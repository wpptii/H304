# 与课程范例保持一致的自管理集群连接配置
spring.application.name=HPAS Workers

camunda:
  client:
    mode: self-managed
    grpc-address: http://127.0.0.1:26500
    rest-address: http://127.0.0.1:8080

logging.level.io.camunda.client.impl.CamundaCallCredentials=ERROR

# 投递消息用的参数（默认空；仅供 MessagePublisher 使用，正常启动 Worker 时不要设置）
# 用法：--publish.message=ReferralSupplementReceived --publish.key=REF-001
publish:
  message:
  key:
