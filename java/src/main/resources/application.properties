# Self-managed cluster connection configuration, kept consistent with the course example
spring.application.name=HPAS Workers

camunda:
  client:
    mode: self-managed
    grpc-address: http://127.0.0.1:26500
    rest-address: http://127.0.0.1:8080

logging.level.io.camunda.client.impl.CamundaCallCredentials=ERROR

# Parameters for message delivery (empty by default; used by MessagePublisher only,
# # do not set them when starting the workers normally)
# Usage: --publish.message=ReferralSupplementReceived --publish.key=REF-001
publish:
  message:
  key:

# =====================================================================
# Database persistence layer (new)
# ---------------------------------------------------------------------
# Purpose: process variables (Camunda variables) live only for the lifetime of the process instance;
#       the configuration below writes "business data" into a real database file, so that the
#       data is still there after the process instance ends and the application restarts, and cross-instance reporting can be done in SQL.
# =====================================================================

# --- Datasource: file-based H2 (./data/hpas.mv.db relative to the java directory) ---
# AUTO_SERVER=TRUE lets several processes (for example the h2 Shell or DBeaver) connect to the same file database at once
spring.datasource.url=jdbc:h2:file:./data/hpas;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate: create tables / add columns automatically from the entities at startup (for the demo; use Flyway/Liquibase in production) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- H2 console: http://127.0.0.1:8090/h2-console ---
# JDBC URL: jdbc:h2:file:./data/hpas;AUTO_SERVER=TRUE, user name sa, empty password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Demonstration API port: 8080 belongs to Camunda, so 8090 is used here ---
server.port=8090
